name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — a stale red X helps nobody.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The point of this matrix is not "does it run on Windows" — it is the
  # central claim of the library: the same scene must produce the same bits on
  # every OS, architecture and Node version. test/golden.test.mjs compares
  # against checksums recorded once, so any platform that disagrees goes red.
  test:
    name: test · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:only

      - name: Cross-platform determinism contract
        run: node scripts/golden.mjs --check

  # macos-latest is arm64; this adds a second architecture on Linux so the
  # golden checksums are proven across instruction sets, not just OSes.
  determinism-arm:
    name: determinism · linux/arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/golden.mjs --check

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run bench | tee bench.txt
      - name: Publish to the job summary
        shell: bash
        run: |
          {
            echo '### Benchmarks'
            echo
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      # Pack the tarball, install it into a scratch project and import it the
      # way a user would. This catches a broken "exports" map or a missing
      # dist file, which unit tests running from the repo never would.
      - name: Pack and consume as a real dependency
        shell: bash
        run: |
          npm pack --silent | tail -n1 > .tgz
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$(cat "$GITHUB_WORKSPACE/.tgz")" --silent
          node -e "
            const { World, BodyType, Circle, VERSION } = require('pulse2d');
            const w = new World({ gravity: { x: 0, y: -10 } });
            const b = w.createBody({ type: BodyType.Dynamic, position: { x: 0, y: 5 } });
            b.addFixture({ shape: Circle.of(0.5), density: 1 });
            for (let i = 0; i < 60; i++) w.step();
            if (!(b.getPosition().toFloats().y < 5)) throw new Error('CJS entry did not simulate');
            console.log('cjs ok', VERSION);
          "
          node --input-type=module -e "
            import { World, BodyType, Circle } from 'pulse2d';
            import { World as FixedWorld } from 'pulse2d/fixed';
            if (World === FixedWorld) throw new Error('the fixed entry point resolves to the float64 build');
            console.log('esm + fixed entry ok');
          "
          node --input-type=module -e "
            import ts from 'typescript';
          " 2>/dev/null || true

      # The package is "type": "module", so its .d.ts files are ESM
      # declarations. Without a CommonJS copy, a require() consumer under
      # node16 resolution gets TS1479 at compile time even though the .cjs
      # bundle runs fine. Check every resolution mode a user might pick.
      - name: Type declarations resolve under every resolution mode
        shell: bash
        run: |
          cd /tmp/consumer
          npm install typescript --silent
          cat > probe.ts <<'TS'
          import { World, BodyType, Circle, type BodyDef } from 'pulse2d';
          import { World as FixedWorld, type WorldDef } from 'pulse2d/fixed';
          const def: BodyDef = { type: BodyType.Dynamic, position: { x: 0, y: 1 } };
          const wd: WorldDef = { gravity: { x: 0, y: -10 } };
          const w = new World(wd);
          w.createBody(def).addFixture({ shape: Circle.of(0.5), density: 1 });
          w.step();
          new FixedWorld(wd).step();
          TS
          fail=0
          for mode in node16 nodenext bundler; do
            case "$mode" in
              bundler) module=esnext ;;
              *)       module="$mode" ;;
            esac
            cat > "tsconfig.$mode.json" <<JSON
          { "compilerOptions": { "module": "$module", "moduleResolution": "$mode",
              "target": "es2020", "strict": true, "noEmit": true }, "files": ["probe.ts"] }
          JSON
            if npx tsc -p "tsconfig.$mode.json"; then
              echo "  $mode ok"
            else
              echo "::error::type declarations do not resolve under moduleResolution=$mode"
              fail=1
            fi
          done
          exit $fail
